[project]
name = "dictcc"
version = "0.2.0"
description = "Command-line client for dict.cc translations"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "tabulate>=0.9",
]

[project.scripts]
dictcc = "dictcc:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["dictcc.py"]
