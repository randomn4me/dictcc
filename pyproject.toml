[project]
name = "dictcc"
version = "0.3.0"
description = "dict.cc client library and command-line tool"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "tabulate>=0.9",
]

[project.scripts]
dictcc = "dictcc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dictcc"]
